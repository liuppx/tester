<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Tester 用例脑图</title><link rel="stylesheet" href="/assets/cases.css"></head><body><header><div><h1>测试用例脑图</h1><p>从项目用例文档实时整理。点击模块展开用例，再选一条查看详细条件和步骤。</p></div><div class="tools"><label for="project">项目</label><select id="project"></select><input id="search" type="search" placeholder="搜索编号或用例名称" aria-label="搜索编号或用例名称"><button id="zoom-out" type="button" aria-label="缩小脑图">−</button><button id="zoom-in" type="button" aria-label="放大脑图">+</button><a href="architecture">项目依赖图</a><a href="/">返回测试控制台</a></div></header>
