    # Include inside the Tester HTTPS server. Keep report locations in that server.
    location ^~ /api/ {
        auth_basic off;
        client_max_body_size 1m;
        proxy_pass http://127.0.0.1:18082/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 15s;
        add_header Cache-Control "no-store" always;
        add_header X-Frame-Options "DENY" always;
    }

    location ^~ /assets/ {
        auth_basic off;
        alias /opt/deploy/static/tester-web/current/assets/;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /web3-bs.js {
        auth_basic off;
        alias /opt/deploy/static/tester-web/current/web3-bs.js;
        add_header Cache-Control "no-cache";
    }

    location = /report {
        return 301 /report/;
    }

    location ^~ /report/ {
        auth_basic off;
        rewrite ^/report/(.*)$ /api/reports/files/$1 last;
    }

    location / {
        auth_basic off;
        root /opt/deploy/static/tester-web/current;
        index index.html;
        try_files $uri $uri.html $uri/ =404;
        add_header Cache-Control "no-store" always;
        add_header X-Frame-Options "DENY" always;
    }
