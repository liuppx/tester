    location = / {
        return 302 /report/control/;
    }

    location = /report/control {
        auth_basic off;
        return 301 /report/control/;
    }

    location ^~ /report/control/api/ {
        auth_basic off;
        client_max_body_size 1m;
        proxy_pass http://127.0.0.1:18082/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 15s;
        add_header Cache-Control "no-store" always;
        add_header X-Frame-Options "DENY" always;
    }

    location = /report/control/ { auth_basic off; alias /opt/deploy/static/tester-web/current/index.html; }
    location = /report/control/cases { auth_basic off; alias /opt/deploy/static/tester-web/current/cases.html; }
    location = /report/control/architecture { auth_basic off; alias /opt/deploy/static/tester-web/current/architecture.html; }
    location ^~ /report/control/assets/ {
        auth_basic off;
        alias /opt/deploy/static/tester-web/current/assets/;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location = /report/control/web3-bs.js {
        auth_basic off;
        alias /opt/deploy/static/tester-web/current/web3-bs.js;
        add_header Cache-Control "no-cache";
    }

    location = /report/control/index.html { auth_basic off; alias /opt/deploy/static/tester-web/current/index.html; }
    location = /report/control/cases.html { auth_basic off; alias /opt/deploy/static/tester-web/current/cases.html; }
    location = /report/control/architecture.html { auth_basic off; alias /opt/deploy/static/tester-web/current/architecture.html; }
